# Độ nhạy theo c_puct của L8 (200 mô phỏng): mỗi giá trị gặp L7 (c_puct = 1,5; 200 mô phỏng).
# Mốc c_puct = 1,5 là cặp L8-sims200 trong experiments/l8_sims_heldout.
defaults: [base, budgets/mode_b_fixed, arena/round_robin]
experiment: {kind: tournament, name: cpuct_heldout, rq: [RQ1]}
run: {root: runs/eval}
arena:
  pairs: challengers_vs_baselines
  games_per_pair: 100
  workers: 4
  openings: {file: runs/openings/openings_heldout_v2.json, seed: 20261126}
baselines:
  - {from: agents/l7_puct, id: L7-200, budget: {max_sims: 200}, params: {backend: native}}
agents:
  - {from: agents/l8_alphazero, id: L8-c0.5, budget: {max_sims: 200}, params: {backend: native, c_puct: 0.5}}
  - {from: agents/l8_alphazero, id: L8-c1.0, budget: {max_sims: 200}, params: {backend: native, c_puct: 1.0}}
  - {from: agents/l8_alphazero, id: L8-c3.0, budget: {max_sims: 200}, params: {backend: native, c_puct: 3.0}}
  - {from: agents/l8_alphazero, id: L8-c5.0, budget: {max_sims: 200}, params: {backend: native, c_puct: 5.0}}
