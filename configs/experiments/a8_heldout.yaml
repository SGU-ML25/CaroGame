# A8 trên khai cuộc giữ riêng — MCTS có / không xử lý chiến thuật ở gốc (root_tactics).
# Giữ: 800 mô phỏng, rollout light. Mỗi cấu hình gặp L2 và L3: 50 khai cuộc × 2 màu = 100 ván mỗi cặp.
defaults: [base, budgets/mode_b_fixed, arena/round_robin]
experiment: {kind: tournament, name: a8_heldout, rq: [RQ1]}
run: {root: runs/eval}
arena:
  pairs: challengers_vs_baselines
  games_per_pair: 100
  workers: 4
  openings: {file: runs/openings/openings_heldout_v2.json, seed: 20261126}
baselines:
  - agents/l2_rule
  - {from: agents/l3_alphabeta, id: L3-AlphaBeta, budget: {max_depth: 4}, params: {backend: native}}
agents:
  - {from: agents/l4_mcts, id: MCTS-light,        budget: {max_sims: 800}, params: {rollout: light, root_tactics: false}}
  - {from: agents/l4_mcts, id: MCTS-light-tactic, budget: {max_sims: 800}, params: {rollout: light, root_tactics: true}}
