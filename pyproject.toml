[project]
name = "caro"
version = "0.1.0"
description = "Caro 11×11 (5 quân thắng, không luật chặn 2 đầu): engine bitboard và tác tử AI cấp 1–8"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
nn = ["torch>=2.2"]                        # cấp 5–8
ui = ["fastapi>=0.110", "uvicorn>=0.29"]   # demo người–máy
analysis = ["pandas>=2.2", "matplotlib>=3.8", "jupyter>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
caro-config = "caro.config:main"
caro-hub = "caro.hub:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
