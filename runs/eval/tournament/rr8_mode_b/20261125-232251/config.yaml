project: caro-11x11
seed: 2026
device: auto
engine:
  size: 11
  win_length: 5
  layout: stride11
experiment:
  kind: tournament
  name: rr8_mode_b
  description: ''
  rq:
  - RQ1
  - RQ2
  - RQ4
  config: experiments/rr8_mode_b
run:
  root: runs/eval
  tag: null
  index: runs/index.jsonl
log:
  level: INFO
  console: true
  file: run.log
  games: games.jsonl
  metrics: metrics.jsonl
  per_move_stats: true
  flush_every: 1
checkpoint:
  dir: checkpoints
  keep_last: 5
budget:
  mode: fixed
  time_ms: null
  max_depth: 4
  max_sims: 800
arena:
  format: round_robin
  games_per_pair: 200
  swap_colors: true
  max_plies: 121
  workers: 4
  openings:
    count: 100
    plies:
    - 2
    - 4
    region: 5
    seed: 7
    file: runs/openings/openings_v1.json
  stats:
    ci: wilson
    confidence: 0.95
    bootstrap: 1000
    elo: true
  num_openings: 50
agents:
- id: L1-Random
  level: 1
  kind: random
  params: {}
  source: agents/l1_random
  limits:
    mode: fixed
    time_ms: null
    max_depth: 4
    max_sims: 800
- id: L2-Rule
  level: 2
  kind: rule_based
  params:
    priorities:
    - P1
    - P2
    - P3
    - P4
    - P5
    - P6
    - P7
    radius: 2
    eval_weights: default
  source: agents/l2_rule
  limits:
    mode: fixed
    time_ms: null
    max_depth: 4
    max_sims: 800
- id: L3-AlphaBeta
  level: 3
  kind: alphabeta
