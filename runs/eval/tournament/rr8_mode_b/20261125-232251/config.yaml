    pruning: true
    move_ordering: true
    tt: true
    tt_size_mb: 64
    iterative_deepening: true
    forced_moves: true
    radius: 2
    backend: native
    eval_weights: default
  source: agents/l3_alphabeta
  limits:
    mode: fixed
    time_ms: null
    max_depth: 4
    max_sims: 800
- id: L4-MCTS
  level: 4
  kind: mcts
  params:
    c_uct: 1.4
    rollout: random
    rollout_radius: 1
    candidate_radius: 2
  source: agents/l4_mcts
  limits:
    mode: fixed
    time_ms: null
    max_depth: 4
    max_sims: 400
- id: L5-PolicySL
