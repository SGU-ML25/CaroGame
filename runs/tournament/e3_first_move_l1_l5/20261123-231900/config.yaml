project: caro-11x11
seed: 2026
device: auto
engine:
  size: 11
  win_length: 5
  layout: stride11
experiment:
  kind: tournament
  name: e3_first_move_l1_l5
  description: ''
  rq:
  - RQ4
  config: experiments/e3_first_move_l1_l5.yaml
run:
  root: runs
  tag: null
  index: runs/index.jsonl
log:
  level: INFO
  console: true
  file: run.log
  games: games.jsonl
  metrics: metrics.jsonl
  per_move_stats: true
  flush_every: 1
checkpoint:
  dir: checkpoints
  keep_last: 5
budget:
  mode: fixed
  time_ms: null
  max_depth: 4
  max_sims: 800
arena:
  format: round_robin
  games_per_pair: 200
  swap_colors: true
  max_plies: 121
  workers: 4
  openings:
    count: 100
    plies:
    - 2
    - 4
    region: 5
    seed: 7
    file: runs/openings/openings_v1.json
  stats:
    ci: wilson
    confidence: 0.95
    bootstrap: 1000
    elo: true
  pairs: self_play
agents:
- id: L1-Random
  level: 1
  kind: random
  params: {}
  source: agents/l1_random
  limits:
    mode: fixed
    time_ms: null
    max_depth: 4
    max_sims: 800
- id: L2-Rule
  level: 2
  kind: rule_based
  params:
    priorities:
    - P1
    - P2
    - P3
    - P4
    - P5
    - P6
    - P7
    radius: 2
    eval_weights: default
  source: agents/l2_rule
  limits:
    mode: fixed
    time_ms: null
    max_depth: 4
    max_sims: 800
- id: L3-AlphaBeta
  level: 3
  kind: alphabeta
  params:
    pruning: true
    move_ordering: true
    tt: true
    tt_size_mb: 64
    iterative_deepening: true
    forced_moves: true
    radius: 2
    eval_weights: default
  source: agents/l3_alphabeta
  limits:
    mode: fixed
    time_ms: null
    max_depth: 4
    max_sims: 800
- id: L4-MCTS
  level: 4
  kind: mcts
  params:
    c_uct: 1.4
    rollout: random
    rollout_radius: 1
    candidate_radius: 2
  source: agents/l4_mcts
  limits:
    mode: fixed
    time_ms: null
    max_depth: 4
    max_sims: 800
- id: L5-PolicySL
  level: 5
  kind: policy
  params:
    checkpoint: model:l5
    temperature: 0
  source: agents/l5_policy_sl
  limits:
    mode: fixed
    time_ms: null
    max_depth: 4
    max_sims: 800
